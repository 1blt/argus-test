name: "Discover Mode Tests"

on:
  workflow_call:
    inputs:
      argus_ref:
        description: 'Argus branch/tag to test'
        required: false
        type: string
        default: 'main'
    outputs:
      results:
        description: "JSON array of individual test results"
        value: ${{ jobs.validate-results.outputs.results }}

permissions:
  contents: read
  actions: write        # dispatching argus-run.yml
  security-events: write
  packages: read
  pull-requests: write

# ============================================================================
# Discover mode tests: matrix over a parameter table, dispatch architecture.
#
# max-parallel: 1 is load-bearing, not tuning. These previously ran as a needs
# chain (D2 needs D1, D3 needs D2, D4 needs D3) purely to serialise discover
# runs, which all build the same Dockerfiles under tests/. The matrix expresses
# that directly, and drops the `if: always()` D4 needed to survive a
# deliberately-failing D3 -- under dispatch D3 is green when it passes.
#
# D3 and D4 assert argus FAILS, and are green when it does.
#
# D5 is a separate job rather than a matrix row: it needs `search_paths` and
# the workflow_call outputs, which exist only on refs carrying argus PR #427,
# and it asserts on those outputs rather than on the run's conclusion.
# ============================================================================

jobs:
  discover:
    name: "${{ matrix.t.id }}: ${{ matrix.t.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        t:
          - { id: D1, name: "discover mixed",           expect: success, scanners: "trivy,grype", sev: none,     allow: 'true'  }
          - { id: D2, name: "discover trivy only",      expect: success, scanners: "trivy",       sev: none,     allow: 'true'  }
          - { id: D3, name: "discover fail-closed",     expect: failure, scanners: "trivy,grype", sev: critical, allow: 'false' }
          - { id: D4, name: "build gate (severity none)", expect: failure, scanners: "trivy",     sev: none,     allow: 'false' }
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: ${{ matrix.t.id }}
          expect: ${{ matrix.t.expect }}
          argus_ref: ${{ inputs.argus_ref || 'main' }}
          scan_mode: discover
          scanners: ${{ matrix.t.scanners }}
          fail_on_severity: ${{ matrix.t.sev }}
          allow_failure: ${{ matrix.t.allow }}
      - name: Record result
        if: always()
        run: |
          jq -n -c --arg id "${{ matrix.t.id }}" \
                   --arg status "${{ steps.t.outputs.status || 'FAIL' }}" \
                   --arg child "${{ steps.t.outputs.child_run_id }}" \
                   '{id:$id, status:$status, child:$child}' > "result-${{ matrix.t.id }}.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresult-${{ matrix.t.id }}
          path: result-${{ matrix.t.id }}.json
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # D5: the MIXED-incomplete discover run.
  #
  # Two Dockerfiles under tests/dockerfiles/mixed: one builds and scans, one
  # fails to build so its leg never writes argus-results.json.
  #
  # WHY THIS CASE AND NOT THE EASY ONE. "Every leg failed" is already caught by
  # the IMAGES -eq 0 guard in container-scan.yml's summary. The mixed run is the
  # common shape -- one image of several goes unscanned -- and it was silently
  # green until PR #427, because the summary aggregated only the legs that
  # produced files and never noticed the missing one. The reviewer's blocker 2
  # is that the argus_scan_incomplete sentinel is warned about and then has no
  # effect on overall_status, so this is expected RED against
  # fix/container-scan-no-silent-pass at 4e2b481a.
  #
  # ASSERTED ON OUTPUTS, NOT ON THE CONCLUSION. A broken build already fails the
  # run, so conclusion alone would pass for the wrong reason -- it cannot tell
  # "the build broke" from "the build broke AND the summary noticed the image
  # went unscanned". overall_status and images_scanned can, and they are what a
  # consumer reads.
  #
  # The failure is induced, not mocked: the base image is withdrawn and the
  # registry host does not resolve. See tests/dockerfiles/mixed/fails/Dockerfile.
  #
  # Skipped on refs without the outputs. That reads as "no assurance" on the
  # dashboard rather than as a pass, which is the honest answer for a ref where
  # the feature does not exist.
  # --------------------------------------------------------------------------
  d5-mixed-incomplete:
    name: "D5: mixed-incomplete discover run"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: inputs.argus_ref != 'main'
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: ./.github/actions/argus-scan
        with:
          test_id: D5
          # The scan genuinely fails -- one Dockerfile does not build. The
          # assertion that matters is the output check below it.
          expect: failure
          argus_ref: ${{ inputs.argus_ref }}
          scan_mode: discover
          search_paths: tests/dockerfiles/mixed
          scanners: trivy
          fail_on_severity: none
          allow_failure: 'false'
          # images_scanned must count ONLY the leg that produced results, and
          # overall_status must not be success while an image went unscanned.
          assert_outputs: >-
            .outputs.overall_status != "success"
            and (.outputs.images_scanned | tonumber) == 1
      - name: Record result
        if: always()
        run: |
          jq -n -c --arg id "D5" \
                   --arg status "${{ steps.t.outputs.status || 'FAIL' }}" \
                   --arg child "${{ steps.t.outputs.child_run_id }}" \
                   '{id:$id, status:$status, child:$child}' > "result-D5.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresult-D5
          path: result-D5.json
          retention-days: 7
          if-no-files-found: error

  validate-results:
    name: "Validate Discover Test Results"
    runs-on: ubuntu-latest
    needs: [discover, d5-mixed-incomplete]
    if: always()
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: testresult-D*
          path: ./results
          merge-multiple: true
      - name: Build results JSON
        id: collect
        run: |
          set -uo pipefail
          cat > /tmp/detail.json <<'JSON'
          {
            "D1": ["discover mixed","Does argus complete a discover run over all three Dockerfiles when allow_failure is true?"],
            "D2": ["discover trivy only","Does argus complete a discover run with trivy as the only scanner when allow_failure is true?"],
            "D3": ["discover fail-closed","Does argus fail the workflow when a discover run hits both a broken build and criticals with allow_failure false?"],
            "D4": ["build gate isolated","Does argus fail the workflow when a discovered Dockerfile does not build, even with the severity gate switched off?"],
            "D5": ["mixed-incomplete discover run","When one of two discovered images fails to build, does container-scan.yml report a non-success overall_status and count only the image it actually scanned?"]
          }
          JSON
          # D5 is skipped on refs that do not declare the outputs it asserts on.
          # A missing artifact must surface as "skip" -- no assurance -- rather
          # than vanishing and leaving the board reporting four tests as all.
          if [ ! -f ./results/result-D5.json ]; then
            echo '{"id":"D5","status":"skip","child":""}' > ./results/result-D5.json
            echo "D5 produced no artifact; recorded as skip"
          fi
          RESULTS=$(jq -s -c --slurpfile d /tmp/detail.json '
            # Filter by id rather than trusting the artifact glob. All suites share
            # one workflow run, so a broad pattern pulls in results from other suites and
            # tonumber then dies on a foreign id -- which is exactly how this failed.
            [ .[] | select(.id | test("^D[0-9]+$")) | { id: .id, name: ($d[0][.id][0] // .id), detail: ($d[0][.id][1] // ""), status: .status } ]
            | sort_by(.id | ltrimstr("D") | tonumber)
          ' ./results/result-*.json)
          echo "$RESULTS" | jq -e 'length > 0' >/dev/null || { echo "::error::no discover results collected"; exit 1; }
          echo "collected $(echo "$RESULTS" | jq 'length') results"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
